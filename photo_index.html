<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMERTI Photo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:#e5e7eb;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:24px 24px;display:flex;flex-direction:column;}

/* TOOLBAR */
.toolbar{height:72px;background:#0b1c40;color:#fffaf3;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:2px solid rgba(181,135,46,.5);box-shadow:0 4px 18px rgba(0,0,0,.3);flex-shrink:0;z-index:50;}
.logo-pill{display:flex;align-items:center;gap:10px;background:#fff;padding:6px 10px;border-radius:6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.1);}
.logo-pill img{height:34px;width:auto;object-fit:contain;}
.logo-divider{width:1px;height:26px;background:#e5e7eb;}
.brand-text h1{font-family:'Playfair Display',serif;font-size:22px;line-height:1;color:#b5872e;letter-spacing:.05em;font-weight:700;}
.brand-text p{font-size:10px;color:rgba(255,250,243,.8);letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-top:4px;}
.divider-v{width:1px;height:40px;background:rgba(181,135,46,.3);margin:0 10px;}
.controls{display:flex;align-items:center;gap:16px;background:#122a5e;padding:6px 16px;border-radius:8px;border:1px solid rgba(181,135,46,.3);}
.ctrl-group{display:flex;align-items:center;gap:10px;}
.ctrl-label{font-size:13px;color:rgba(255,250,243,.9);font-weight:600;white-space:nowrap;}
.ctrl-select{background:#0b1c40;border:1px solid rgba(181,135,46,.5);border-radius:5px;padding:5px 10px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;cursor:pointer;outline:none;}
.ctrl-select:focus{border-color:#b5872e;}
.ctrl-sep{width:1px;height:24px;background:rgba(181,135,46,.3);margin:0 4px;}
.actions{display:flex;align-items:center;gap:10px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:6px;border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;}
.btn-ghost{background:transparent;color:#fffaf3;border:1px solid transparent;}
.btn-ghost:hover{background:#122a5e;border-color:rgba(181,135,46,.3);}
.btn-danger{background:transparent;color:#fca5a5;border:1px solid transparent;}
.btn-danger:hover{background:rgba(127,29,29,.4);border-color:rgba(185,28,28,.4);}
.btn-primary{background:#b5872e;color:#0b1c40;box-shadow:0 0 15px rgba(181,135,46,.3);}
.btn-primary:hover{background:#d4af37;transform:translateY(-1px);}
.actions-sep{width:1px;height:32px;background:rgba(181,135,46,.3);margin:0 6px;}
.btn svg{width:16px;height:16px;flex-shrink:0;vertical-align:middle;}

/* WORKSPACE */
.workspace{flex:1;position:relative;overflow:hidden;}

/* FRAME — no border-image, fully html2canvas compatible */
/* frame-shell background gradient IS the gold border */
#poster{
  position:absolute;
  width:900px;height:1200px;
  background:linear-gradient(145deg,#f7df82 0%,#d4af37 12%,#aa7c11 25%,#5a3d00 42%,#7a5500 50%,#b08820 62%,#d4af37 75%,#f0cd6a 88%,#c8941e 100%);
  box-shadow:0 0 0 4px #3d2600,0 0 0 6px rgba(212,175,55,.45),0 30px 60px -10px rgba(0,0,0,.55),0 0 50px rgba(181,135,46,.2);
}
/* inner ruled line */
#poster::before{content:'';position:absolute;inset:20px;border:1px solid rgba(212,175,55,.55);pointer-events:none;z-index:10;}
/* mat board = cream inner area */
.frame-mat{
  position:absolute;inset:24px;
  background:hsl(36,100%,98%);
  box-shadow:inset 0 8px 20px rgba(0,0,0,.18);
  display:flex;flex-direction:column;
  padding:28px;
  overflow:hidden;
}

/* Corner ornaments positioned inside frame-mat */
.corner{position:absolute;pointer-events:none;}
.co-tl{top:6px;left:6px;width:56px;height:56px;border-top:4px solid #b5872e;border-left:4px solid #b5872e;opacity:.9;}
.co-tl2{top:14px;left:14px;width:20px;height:20px;border-top:3px solid #b5872e;border-left:3px solid #b5872e;opacity:.6;}
.co-tr{top:6px;right:6px;width:56px;height:56px;border-top:4px solid #b5872e;border-right:4px solid #b5872e;opacity:.9;}
.co-tr2{top:14px;right:14px;width:20px;height:20px;border-top:3px solid #b5872e;border-right:3px solid #b5872e;opacity:.6;}
.co-bl{bottom:6px;left:6px;width:56px;height:56px;border-bottom:4px solid #b5872e;border-left:4px solid #b5872e;opacity:.9;}
.co-bl2{bottom:14px;left:14px;width:20px;height:20px;border-bottom:3px solid #b5872e;border-left:3px solid #b5872e;opacity:.6;}
.co-br{bottom:6px;right:6px;width:56px;height:56px;border-bottom:4px solid #b5872e;border-right:4px solid #b5872e;opacity:.9;}
.co-br2{bottom:14px;right:14px;width:20px;height:20px;border-bottom:3px solid #b5872e;border-right:3px solid #b5872e;opacity:.6;}

/* HEADER */
.poster-header{text-align:center;margin-bottom:18px;margin-top:8px;position:relative;z-index:1;}
.poster-title{font-family:'Playfair Display',serif;font-size:40px;line-height:1.15;color:#0b1c40;font-weight:900;margin-bottom:10px;}
.poster-org{font-size:18px;color:#a11d2b;font-weight:700;text-transform:uppercase;letter-spacing:.18em;margin-bottom:8px;}
.poster-meta{font-size:16px;color:rgba(36,26,16,.75);font-weight:500;}

/* Editable */
[contenteditable]{outline:none;display:inline-block;min-width:20px;cursor:text;border-radius:4px;transition:background .15s;}
[contenteditable]:hover{background:rgba(181,135,46,.08);}
[contenteditable]:focus{outline:2px dashed rgba(181,135,46,.6);outline-offset:4px;background:rgba(181,135,46,.06);}
[contenteditable]:empty::before{content:attr(data-placeholder);color:rgba(11,28,64,.3);font-style:italic;pointer-events:none;}

/* PHOTO AREA */
.photo-area{flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden;background:#fff;padding:8px;border:2px solid rgba(181,135,46,.3);box-shadow:inset 0 3px 8px rgba(0,0,0,.04);position:relative;z-index:1;}
.photo-row{flex:1;display:flex;gap:8px;}
.photo-slot{
  flex:1;position:relative;overflow:hidden;
  border:1px solid rgba(181,135,46,.2);
  background-color:hsl(36,100%,98%);
  background-image:linear-gradient(45deg,rgba(181,135,46,.05) 25%,transparent 25%,transparent 75%,rgba(181,135,46,.05) 75%),linear-gradient(45deg,rgba(181,135,46,.05) 25%,transparent 25%,transparent 75%,rgba(181,135,46,.05) 75%);
  background-size:20px 20px;background-position:0 0,10px 10px;
  display:flex;align-items:center;justify-content:center;
}
.slot-img{width:100%;height:100%;object-fit:contain;display:block;}
.slot-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:rgba(181,135,46,.4);pointer-events:none;position:absolute;inset:0;}
.slot-empty svg{width:36px;height:36px;}
.slot-empty span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.slot-hover{position:absolute;inset:0;background:rgba(11,28,64,.82);opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:16px;}
.photo-slot:hover .slot-hover{opacity:1;}
.slot-btn{border:none;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.slot-btn-add,.slot-btn-replace{background:#fffaf3;color:#0b1c40;}
.slot-btn-add:hover,.slot-btn-replace:hover{background:#b5872e;color:#fff;transform:scale(1.1);}
.slot-btn-remove{background:#a11d2b;color:#fff;}
.slot-btn-remove:hover{background:#c0392b;transform:scale(1.1);}
.slot-btn svg{width:20px;height:20px;}

/* FOOTER */
.poster-footer{margin-top:14px;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:2px solid rgba(181,135,46,.3);position:relative;z-index:1;}
.footer-logo{width:160px;display:flex;}
.footer-logo img{height:70px;width:auto;object-fit:contain;}
.footer-logo.right{justify-content:flex-end;}
.footer-tagline{flex:1;text-align:center;padding:0 16px;font-family:'Playfair Display',serif;font-size:22px;color:#122a5e;font-weight:500;font-style:italic;}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(11,28,64,.92);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fffaf3;backdrop-filter:blur(4px);}
.overlay.hidden{display:none;}
.spinner{width:64px;height:64px;border:5px solid rgba(181,135,46,.3);border-top-color:#b5872e;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay h2{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:8px;}
.overlay p{opacity:.75;font-size:16px;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200;display:flex;flex-direction:column;padding:24px;backdrop-filter:blur(8px);}
.lightbox.hidden{display:none;}
.lightbox-actions{display:flex;justify-content:flex-end;gap:12px;margin-bottom:20px;flex-shrink:0;}
.lightbox-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.lightbox-img-wrap img{max-height:100%;max-width:100%;object-fit:contain;border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.8);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0b1c40;color:#fffaf3;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid rgba(181,135,46,.4);box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .3s ease;z-index:300;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="toolbar">
  <div style="display:flex;align-items:center;gap:16px">
    <div class="logo-pill">
      <img id="csbLogo1" alt="CSB">
      <div class="logo-divider"></div>
      <img id="vanyaLogo1" alt="Vanya">
    </div>
    <div class="divider-v"></div>
    <div class="brand-text">
      <h1>CMER&amp;TI</h1>
      <p>Photo Studio</p>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label class="ctrl-label">
        <svg style="display:inline;width:13px;height:13px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="#b5872e" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Slots:
      </label>
      <select id="slotCount" class="ctrl-select"></select>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
      <label class="ctrl-label">
        <svg style="display:inline;width:13px;height:13px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="#b5872e" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Quality:
      </label>
      <select id="quality" class="ctrl-select">
        <option value="1">Standard (1x)</option>
        <option value="2" selected>High (2x)</option>
        <option value="3">Print (3x)</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-ghost" id="autofillBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
      Auto-fill
    </button>
    <button class="btn btn-danger" id="resetBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Reset
    </button>
    <div class="actions-sep"></div>
    <button class="btn btn-primary" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      Download Poster
    </button>
  </div>
</header>

<div class="workspace" id="workspace">
  <div id="poster">
    <div class="frame-mat">
      <!-- Corner ornaments -->
      <div class="corner co-tl"></div><div class="corner co-tl2"></div>
      <div class="corner co-tr"></div><div class="corner co-tr2"></div>
      <div class="corner co-bl"></div><div class="corner co-bl2"></div>
      <div class="corner co-br"></div><div class="corner co-br2"></div>

      <div class="poster-header">
        <div class="poster-title" contenteditable="true" data-placeholder="Event Title">National Silk Symposium 2024</div>
        <div class="poster-org" contenteditable="true" data-placeholder="Organization Name">Central Muga Eri Research &amp; Training Institute</div>
        <div class="poster-meta" contenteditable="true" data-placeholder="Date and Venue">October 15, 2024 &bull; Jorhat, Assam</div>
      </div>

      <div class="photo-area" id="photoArea"></div>

      <div class="poster-footer">
        <div class="footer-logo"><img id="csbLogo2" alt="Central Silk Board"></div>
        <div class="footer-tagline" contenteditable="true" data-placeholder="Event tagline">"Preserving Heritage, Advancing Sericulture"</div>
        <div class="footer-logo right"><img id="vanyaLogo2" alt="Vanya Silk"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="genOverlay">
  <div class="spinner"></div>
  <h2>Generating High-Resolution Poster</h2>
  <p>Applying official letterhead and frame…</p>
</div>

<div class="lightbox hidden" id="lightbox">
  <div class="lightbox-actions">
    <a id="saveBtn" class="btn btn-primary" download="CMERTI-Poster.png">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      Save to Computer
    </a>
    <button class="btn btn-ghost" id="closeLightboxBtn" style="border:1px solid rgba(255,255,255,.2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      Close
    </button>
  </div>
  <div class="lightbox-img-wrap"><img id="resultImg" alt="Generated Poster"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="bulkInput" accept="image/*" multiple style="display:none">
<input type="file" id="singleInput" accept="image/*" style="display:none">

var saveBtn=document.getElementById('saveBtn');
var toastEl=document.getElementById('toast');
var bulkInput=document.getElementById('bulkInput');
var singleInput=document.getElementById('singleInput');

for(var i=1;i<=24;i++){var o=document.createElement('option');o.value=i;o.textContent=i+(i===1?' Photo':' Photos');if(i===1)o.selected=true;slotCountSel.appendChild(o);}

function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.remove('show');},2800);}

function updateScale(){
  var pad=40,aw=workspace.clientWidth-pad*2,ah=workspace.clientHeight-pad*2;
  var s=Math.min(aw/900,ah/1200,1);
  var l=Math.max(0,(workspace.clientWidth-900*s)/2);
  var t=Math.max(0,(workspace.clientHeight-1200*s)/2);
  poster.style.transformOrigin='top left';
  poster.style.transform='scale('+s+')';
  poster.style.left=l+'px';poster.style.top=t+'px';
  poster.style.width='900px';poster.style.height='1200px';
}
window.addEventListener('resize',updateScale);updateScale();

function getRows(n){
  if(!n)return[];
  var nr=Math.max(1,Math.round(Math.sqrt(n))),rows=[],rem=n,si=0;
  for(var i=0;i<nr;i++){var rl=nr-i,cnt=Math.ceil(rem/rl),row=[];for(var j=0;j<cnt;j++)row.push(si++);rows.push(row);rem-=cnt;}
  return rows;
}

function svgPlus(){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>';}
function svgRefresh(){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';}
function svgX(){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>';}

function renderGrid(){
  photoArea.innerHTML='';
  getRows(slots.length).forEach(function(row){
    var rowEl=document.createElement('div');rowEl.className='photo-row';
    row.forEach(function(idx){
      var slot=document.createElement('div');slot.className='photo-slot';
      if(slots[idx]){
        var img=document.createElement('img');img.className='slot-img';img.src=slots[idx].url;img.alt='Photo '+(idx+1);slot.appendChild(img);
      } else {
        var emp=document.createElement('div');emp.className='slot-empty';
        emp.innerHTML=svgPlus()+'<span>Add Photo '+(idx+1)+'</span>';slot.appendChild(emp);
      }
      var hov=document.createElement('div');hov.className='slot-hover';hov.setAttribute('data-html2canvas-ignore','true');
      var rb=document.createElement('button');rb.className='slot-btn slot-btn-'+(slots[idx]?'replace':'add');
      rb.title=slots[idx]?'Replace photo':'Add photo';rb.innerHTML=svgRefresh();
      rb.addEventListener('click',(function(i){return function(e){e.stopPropagation();activeIdx=i;singleInput.value='';singleInput.click();};})(idx));
      hov.appendChild(rb);
      if(slots[idx]){var xb=document.createElement('button');xb.className='slot-btn slot-btn-remove';xb.title='Remove photo';xb.innerHTML=svgX();
        xb.addEventListener('click',(function(i){return function(e){e.stopPropagation();if(slots[i])URL.revokeObjectURL(slots[i].url);slots[i]=null;renderGrid();};})(idx));hov.appendChild(xb);}
      slot.appendChild(hov);rowEl.appendChild(slot);
    });
    photoArea.appendChild(rowEl);
  });
}

function syncCount(n){
  while(slots.length<n)slots.push(null);
  if(slots.length>n){for(var i=n;i<slots.length;i++)if(slots[i])URL.revokeObjectURL(slots[i].url);slots.length=n;}
  renderGrid();
}

slotCountSel.addEventListener('change',function(){syncCount(parseInt(this.value,10));});

document.getElementById('autofillBtn').addEventListener('click',function(){bulkInput.value='';bulkInput.click();});
bulkInput.addEventListener('change',function(){
  var files=Array.from(this.files||[]);if(!files.length)return;
  var empty=slots.filter(function(s){return!s;}).length;
  if(files.length>empty)toast('Filled '+empty+' slot(s). Increase Slots for more.');
  files.forEach(function(f){var i=slots.indexOf(null);if(i===-1)return;slots[i]={url:URL.createObjectURL(f),file:f};});
  renderGrid();
});

singleInput.addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f||activeIdx===null)return;
  if(slots[activeIdx])URL.revokeObjectURL(slots[activeIdx].url);
  slots[activeIdx]={url:URL.createObjectURL(f),file:f};activeIdx=null;renderGrid();
});

document.getElementById('resetBtn').addEventListener('click',function(){
  if(!confirm('Remove all uploaded photos?'))return;
  slots.forEach(function(s){if(s)URL.revokeObjectURL(s.url);});
  for(var i=0;i<slots.length;i++)slots[i]=null;renderGrid();toast('All photos cleared.');
});

document.getElementById('downloadBtn').addEventListener('click',function(){
  if(!window.html2canvas){toast('html2canvas not loaded yet, please wait.');return;}
  if(!slots.some(function(s){return s;})){toast('Add at least one photo before downloading.');return;}
  genOverlay.classList.remove('hidden');
  var scale=parseInt(qualitySel.value,10)||2;

  // Remove transform so html2canvas sees the natural 900×1200 element
  var origTransform=poster.style.transform;
  var origLeft=poster.style.left;
  var origTop=poster.style.top;
  var origPosition=poster.style.position;
  poster.style.transform='none';
  poster.style.position='fixed';
  poster.style.left='-9999px';
  poster.style.top='-9999px';
  poster.getBoundingClientRect(); // force layout

  // Wait for fonts
  var ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  ready.then(function(){
    return new Promise(function(res){setTimeout(res,150);});
  }).then(function(){
    return html2canvas(poster,{
      scale:scale,useCORS:true,allowTaint:true,
      backgroundColor:null,logging:false,
      width:900,height:1200,scrollX:0,scrollY:0,
      foreignObjectRendering:false
    });
  }).then(function(canvas){
    // Restore position
    poster.style.transform=origTransform;
    poster.style.position=origPosition;
    poster.style.left=origLeft;
    poster.style.top=origTop;
    updateScale();
    genOverlay.classList.add('hidden');
    var dataUrl=canvas.toDataURL('image/png');
    resultImg.src=dataUrl;
    var stamp=new Date().toISOString().slice(0,10);
    saveBtn.href=dataUrl;saveBtn.download='CMERTI-Poster-'+stamp+'.png';
    lightbox.classList.remove('hidden');
  }).catch(function(err){
    poster.style.transform=origTransform;
    poster.style.position=origPosition;
    poster.style.left=origLeft;
    poster.style.top=origTop;
    updateScale();
    genOverlay.classList.add('hidden');
    console.error(err);toast('Failed to generate. Please try again.');
  });
});

document.getElementById('closeLightboxBtn').addEventListener('click',function(){lightbox.classList.add('hidden');resultImg.src='';});

renderGrid();
})();
</script>
</body>
</html>
